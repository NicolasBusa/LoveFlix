<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="LoveFlix — Entre com a data especial">
  <meta name="theme-color" content="#141414">
  <title>LoveFlix — Entrar</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div class="login-page" id="login-page">

    <!-- Fundo com blur -->
    <div class="login-bg" aria-hidden="true">
      <img id="login-bg-img" src="" alt="">
    </div>

    <!-- Logo no canto -->
    <a href="index.html" class="login-logo" aria-label="Voltar para LoveFlix">LOVEFLIX</a>

    <!-- Card de login -->
    <div class="login-card" role="main">

      <!-- Header do card -->
      <header class="login-card-header">
        <div class="login-couple-avatar">
          <img id="login-avatar-img" src="" alt="">
        </div>
        <h1 class="login-card-title" id="login-card-title"></h1>
        <p class="login-card-subtitle" id="login-card-subtitle">
          Digite a data de início do relacionamento para entrar
        </p>
      </header>

      <!-- Formulário -->
      <form class="login-form" id="login-form" novalidate>

        <div>
          <label class="login-label" for="login-date-input">
            Data do início do relacionamento
          </label>
          <div class="login-input-wrapper">
            <input
              type="text"
              id="login-date-input"
              class="login-input"
              inputmode="numeric"
              placeholder="DD/MM/AAAA"
              maxlength="10"
              autocomplete="off"
              aria-describedby="login-error"
              required
            >
          </div>
        </div>

        <!-- Mensagem de erro -->
        <p class="login-error" id="login-error" role="alert" aria-live="assertive"></p>

        <!-- Botão -->
        <button type="submit" class="login-btn" id="login-submit-btn">
          Entrar ❤️
        </button>

      </form>

      <!-- Dica -->
      <p class="login-hint">
        A senha é a data em que tudo começou.<br>
        Só você sabe quando foi. 💑
      </p>

    </div>

  </div>

  <!-- Scripts -->
  <script src="couple/couple.js"></script>
  <script src="js/utils.js"></script>
  <script>
    function renderLogin(cfg) {
      const bgImg = document.getElementById('login-bg-img');
      bgImg.src = cfg.photos.hero || '';
      bgImg.alt = cfg.coupleTitle || '';

      const avatarImg = document.getElementById('login-avatar-img');
      if (avatarImg) {
        avatarImg.src = cfg.photos.profile || '';
        avatarImg.alt = cfg.coupleTitle || '';
      }

      const title = document.getElementById('login-card-title');
      if (title) title.textContent = cfg.coupleTitle || '';

      const subtitle = document.getElementById('login-card-subtitle');
      if (subtitle && cfg.startDate) {
        subtitle.textContent = `Juntos desde ${formatDateBR(cfg.startDate)} 💑`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderLogin(COUPLE_CONFIG);
    });

    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'UPDATE_CONFIG') {
        window.COUPLE_CONFIG = event.data.config;
        renderLogin(event.data.config);
      }
    });
  </script>
  <script src="js/auth.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="LoveFlix — Acesso Mobile via QR Code">
  <meta property="og:title" content="LoveFlix — Acesso Mobile">
  <meta property="og:description" content="Acesse o LoveFlix no seu celular">
  <meta property="og:image" content="https://loveflix.digital/og-image.jpg">
  <meta property="og:type" content="website">
  <title>LoveFlix — Acesso Mobile</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #141414;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1f1f1f;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 36px 32px;
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    .logo {
      font-size: 1.8rem;
      font-weight: 900;
      color: #e50914;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #aaa;
      margin-bottom: 28px;
    }
    #qr-canvas {
      display: block;
      margin: 0 auto 24px;
      border-radius: 8px;
      background: #fff;
      padding: 12px;
    }
    .url-box {
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 1rem;
      color: #e50914;
      font-weight: 700;
      word-break: break-all;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }
    .steps {
      text-align: left;
      border-top: 1px solid #2a2a2a;
      padding-top: 20px;
      margin-top: 4px;
    }
    .steps p {
      font-size: 0.85rem;
      color: #888;
      line-height: 1.9;
    }
    .steps strong { color: #ccc; }
    .badge {
      display: inline-block;
      background: rgba(229,9,20,0.15);
      border: 1px solid rgba(229,9,20,0.4);
      color: #e50914;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">LOVEFLIX</div>
    <div class="badge">ACESSO MOBILE</div>
    <h1>Escaneie com o celular</h1>
    <canvas id="qr-canvas"></canvas>
    <div class="url-box">http://192.168.5.242:3456</div>
    <div class="steps">
      <p>
        <strong>1.</strong> Certifique-se de que o celular está na <strong>mesma rede Wi-Fi</strong> do computador.<br>
        <strong>2.</strong> Aponte a câmera do celular para o QR code acima.<br>
        <strong>3.</strong> Ou acesse a URL manualmente no navegador do celular.<br>
        <strong>4.</strong> A senha de teste é: <strong>15/03/2019</strong>
      </p>
    </div>
  </div>

  <!-- QR code via API pública (sem dependência local) -->
  <script>
    const url = 'http://192.168.5.242:3456';
    const img = document.createElement('img');
    img.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}&color=000000&bgcolor=ffffff`;
    img.width = 200;
    img.height = 200;
    img.alt = 'QR Code para ' + url;
    img.style.borderRadius = '8px';

    const canvas = document.getElementById('qr-canvas');
    canvas.replaceWith(img);
  </script>
</body>
</html>
